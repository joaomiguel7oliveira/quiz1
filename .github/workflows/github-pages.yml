name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Criar config-local.js com chave secreta
        run: echo "window.__APP_FIREBASE_API_KEY__ = '${{ secrets.FIREBASE_API_KEY }}';" > ./config-local.js

      - name: Debug: listar arquivos e mostrar config-local.js
        run: |
          echo "PWD: $(pwd)"
          echo "Files:"
          ls -la
          echo "\n-- config-local.js (first 5 lines) --"
          sed -n '1,5p' ./config-local.js || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
